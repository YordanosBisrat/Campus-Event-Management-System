<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | NU Events</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/register.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
 
</head>
<body>

  <header>
    <div class="logo"><a href="index.html"><img src="./assets/logo.png" alt="NU Events Logo"></a></div>
    <div class="nav-links">
      <a href="./index.html">Home</a>
      <a href="./events-page.html">Events</a>
      <a href="./about-page.html">About</a>
      <a href="./contact.html">Contact</a>
    </div>
  </header>

  <main>
    <div class="signup-card">
      <h2 class="title">Create Your Account</h2>

      <form id="signupForm">
        <div class="form-group">
          <label for="name">Full Name:</label>
          <input type="text" id="name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input 
            type="email" 
            id="email" 
            placeholder="Enter your email" 
            required 
          />
          <small class="form-error" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="role">Role:</label>
          <select id="role" name="role" required>
            <option value="" disabled selected>Select your role</option>
            <option value="student">Student</option>
            <option value="organizer">Organizer</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Create Password:</label>
          <input type="password" id="password" placeholder="Create a password" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password:</label>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
        </div>

        <button type="submit" class="btn-signup">
          Sign Up
        </button>

        <div class="login-link">
          Already have an account? <a href="login.html">Login</a>
        </div>
      </form>
    </div>
  </main>

  <footer>
    Contact site 
    <a href="#"><i class="fas fa-globe"></i></a>
    <a href="#"><i class="far fa-comment-dots"></i></a>
    <a href="#">@NU_edu.et</a>
    <div style="margin-top:12px;">
      ©2024 nuevents.com, All rights reserved
    </div>
  </footer>

  

  <!-- Your existing signup.js if any -->
  <script src="js/signup.js"></script>
</body>
</html>
