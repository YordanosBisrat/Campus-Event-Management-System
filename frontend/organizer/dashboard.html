<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Organizer Dashboard</title>
  <link rel="stylesheet" href="../css/base.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">Campus Events</div>
      <div class="nav-menu">
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
        <a href="create-event.html" class="nav-link">Create Event</a>
        <a href="my-events.html" class="nav-link">My Events</a>
        <a href="../login.html" class="nav-link">Logout</a>
      </div>
    </div>
  </nav>

  <!-- PAGE CONTENT -->
  <main class="page-content container">
    <div class="section-header">
      <h2>Organizer Dashboard</h2>
      <p class="text-muted">
        Manage and submit campus events for approval
      </p>
    </div>

    <!-- ACTION CARDS -->
    <div class="stats-grid">

      <div class="stat-card">
        <h3>Create New Event</h3>
        <p class="text-muted">
          Submit a new event for admin approval
        </p>
        <a href="create-event.html" class="btn btn-primary btn-sm">
          Create Event
        </a>
      </div>

      <div class="stat-card">
        <h3>My Events</h3>
        <p class="text-muted">
          View your submitted events and their status
        </p>
        <a href="my-events.html" class="btn btn-outline btn-sm">
          View Events
        </a>
      </div>

    </div>
  </main>

</body>
</html>
