<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Event | Organizer</title>
  <link rel="stylesheet" href="../css/base.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">Campus Events</div>
      <div class="nav-menu">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="create-event.html" class="nav-link active">Create Event</a>
        <a href="my-events.html" class="nav-link">My Events</a>
        <a href="../login.html" class="nav-link">Logout</a>
      </div>
    </div>
  </nav>

  <!-- PAGE CONTENT -->
  <main class="page-content container">
    <div class="section-header">
      <h2>Create New Event</h2>
      <p class="text-muted">
        Fill in the details below. Your event will be reviewed by an admin before publishing.
      </p>
    </div>

    <form id="createEventForm" class="form-card">

      <div class="form-group">
        <label for="title">Event Title</label>
        <input type="text" id="title" placeholder="Enter event title" required />
      </div>

      <div class="form-group">
        <label for="description">Event Description</label>
        <textarea id="description" rows="4" placeholder="Describe the event" required></textarea>
      </div>

      <div class="form-group">
        <label for="date">Event Date</label>
        <input type="date" id="date" required />
      </div>

      <div class="form-group">
        <label for="location">Event Location</label>
        <input type="text" id="location" placeholder="Venue or location" required />
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Submit Event for Approval
      </button>

    </form>
  </main>

  <script src="../js/organizer-create-event.js"></script>
</body>
</html>
