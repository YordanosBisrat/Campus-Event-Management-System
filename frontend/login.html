<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | NU Events</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
</head>
<body>

  <header>
    <div class="logo"><a href="#"><img src="./assets/logo.png" alt="NU Logo" width="100" height="50"></a></div>
    <div class="nav-links">
      <a href="./index.html">Home</a>
      <a href="./events-page.html">Events</a>
      <a href="#">About</a>
      <a href="#">Help</a>
    </div>
  </header>

  <main>

    <div class="login-card">

      <div class="welcome">welcome back!</div>
      <h2 class="title">login to your account</h2>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn-login">
          Login
        </button>

      </form>

      <p id="message" class="text-muted" style="min-height:1.4em; font-size:14px; color:var(--text-muted);"></p>

      <div class="forgot">
        Forgot password? <a href="#">Text link</a>
      </div>

      <div class="signup">
        Don't have an account yet? <a href="./register.html">Sign Up</a>
      </div>

    </div>

  </main>

  <footer>
    Contact site 
    <a href="#"><i class="fas fa-globe"></i></a>
    <a href="#"><i class="far fa-comment-dots"></i></a>
    <a href="#">@NU_edu.et</a>
    <div style="margin-top:12px;">
      ©2024 nuevents.com, All rights reserved
    </div>
  </footer>

  <script src="js/auth.js"></script>

</body>
</html>
