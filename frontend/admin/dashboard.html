<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../css/base.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">Campus Events</div>
      <div class="nav-menu">
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
        <a href="pending-events.html" class="nav-link">Pending Events</a>
        <a href="../login.html" class="nav-link">Logout</a>

      </div>
    </div>
  </nav>

  <!-- DASHBOARD CONTENT -->
  <main class="page-content container">
    <div class="section-header">
      <h2>Admin Dashboard</h2>
      <p class="text-muted">System overview & moderation stats</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Events</h3>
        <p id="totalEvents">0</p>
      </div>

      <div class="stat-card">
        <h3>Pending</h3>
        <p id="pendingEvents">0</p>
      </div>

      <div class="stat-card">
        <h3>Approved</h3>
        <p id="approvedEvents">0</p>
      </div>

      <div class="stat-card">
        <h3>Rejected</h3>
        <p id="rejectedEvents">0</p>
      </div>
    </div>
  </main>

  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
